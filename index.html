<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">

    <title>raylib web game</title>
    <link rel="shortcut icon" href="https://www.raylib.com/favicon.ico">
    <script src="https://code.jquery.com/jquery-4.0.0.min.js" integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>

    <link rel="stylesheet" href="style.css">

    <style>
        body { margin: 0px; }
        canvas.emscripten { border: 0px none; background-color: black; outline: none !important; }
    </style>
    </head>
    <body>
        <div class="game-container">
            <canvas class=emscripten id=canvas oncontextmenu=event.preventDefault() tabindex=-1></canvas>

            <div class="game-btn-container">
                <button id="add_entity_btn">Add Cat Entity</button>
                <div class="input-box-divs">
                    <span class="label">x:</span>
                    <input type="number" value="0" min="0" step="1" pattern="[0-9]*" class="input-axis-box" required>
                </div>
                <div class="input-box-divs">
                    <span class="label">y:</span>
                    <input type="number" value="0" min="0" step="1" pattern="[0-9]*" class="input-axis-box" required>
                </div>
            </div>
        </div>

        <script>
            function javascript_game_loop()
            {
                let input_axis_divs = $('.input-box-divs');
                let axis_inputs = $('.input-axis-box');

                if (Module.is_entity_selected())
                {
                    input_axis_divs.show();
                    axis_inputs[0].value = Module.get_current_position().x;
                    axis_inputs[1].value = Module.get_current_position().y;
                }
                else
                {
                    input_axis_divs.hide();
                }

                requestAnimationFrame(javascript_game_loop);
            }

            var Module = {
                onRuntimeInitialized: function () {
                    console.log("onRuntimeInitialized ran!");

                    requestAnimationFrame(javascript_game_loop);

                    $(document).ready(function() {
                        let axis_inputs = $('.input-axis-box');

                        $('#add_entity_btn').click(() => {
                            console.log("Entity Created!");
                            Module.create_entity();

                            axis_inputs[0].value = '0';
                            axis_inputs[1].value = '0';
                        });

                        // Loop through them
                        axis_inputs.each((index, element) => {
                            $(element).on('input', function() {
                                // alert(index);
                                const val = $(this).val().trim();

                                const isNumber = val !== '' && !isNaN(parseFloat(val)) && isFinite(val);
                                if (isNumber) {
                                    let x = axis_inputs[0].value;
                                    let y = axis_inputs[1].value;

                                    Module.set_current_position(x, y);
                                } else if (!isNumber && val !== '') {
                                    alert('Not a number');
                                }
                            })
                        });
                    });
                },
                canvas: (function() {
                    var canvas = document.getElementById('canvas');
                    return canvas;
                })()
            };

            // Makes sure the inputs are only numbers
            $(document).ready(function() {
                $('input[type="number"]').on('keydown', function(e) {
                    if (["e", "E", "+", "-", "."].includes(e.key)) {
                        e.preventDefault();
                    }
                });

                // Only reset when user leaves the field
                $('input[type="number"]').on('blur', function() {
                    if ($(this).val() === "") {
                        $(this).val(0);
                    }
                });
            });
        </script>
        <script src="index.js"></script>
    </body>
</html>
