<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">

    <title>raylib web game</title>
    <link rel="shortcut icon" href="https://www.raylib.com/favicon.ico">
    <script src="https://code.jquery.com/jquery-4.0.0.min.js" integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>

    <link rel="stylesheet" href="style.css">

    <style>
        body { margin: 0px; }
        canvas.emscripten { border: 0px none; background-color: black; outline: none !important; }
    </style>
    </head>
    <body>
        <div class="game-container">
            <div class="game-size-container">
                <div class="input-size-box-divs info-div-input-boxes">
                    <span class="label">width:</span>
                    <input type="number" value="840" min="300" max="800" step="1" pattern="[0-9]*" class="input-size-box" required>
                </div>
                <div class="input-size-box-divs info-div-input-boxes">
                    <span class="label">height:</span>
                    <input type="number" value="640" min="300" max="800" step="1" pattern="[0-9]*" class="input-size-box" required>
                </div>
            </div>
            <canvas class=emscripten id=canvas oncontextmenu=event.preventDefault() tabindex=-1></canvas>

            <div class="game-btn-container">
                <button id="add_entity_btn">Add Sprite</button>
                <div class="input-axis-box-divs info-div-input-boxes">
                    <span class="label">x:</span>
                    <input type="number" value="0" min="0" step="1" pattern="[0-9]*" class="input-axis-box" required>
                </div>
                <div class="input-axis-box-divs info-div-input-boxes">
                    <span class="label">y:</span>
                    <input type="number" value="0" min="0" step="1" pattern="[0-9]*" class="input-axis-box" required>
                </div>
                <div class="input-axis-box-divs info-div-input-boxes">
                    <span class="label">rotation:</span>
                    <input type="number" value="0" min="0" max="360" step="1" pattern="[0-9]*" class="input-axis-box" id="input-angle-box" required>
                    <span>°</span>
                </div>
            </div>
        </div>

        <script>
            function javascript_game_loop()
            {
                let size_inputs = $('.input-size-box');
                size_inputs[1].value = Module.get_window_size().x;
                size_inputs[0].value = Module.get_window_size().y;

                let input_axis_divs = $('.input-axis-box-divs');
                let axis_inputs = $('.input-axis-box');

                if (Module.is_sprite_selected())
                {
                    input_axis_divs.show();
                    axis_inputs[0].value = Module.get_current_position_angle().x;
                    axis_inputs[1].value = Module.get_current_position_angle().y;

                    $('#input-angle-box').val(Module.get_current_position_angle().z);
                }
                else
                {
                    input_axis_divs.hide();
                    // console.log("ee");
                    // alert("e");
                }

                requestAnimationFrame(javascript_game_loop);
            }

            var Module = {
                onRuntimeInitialized: function () {
                    console.log("onRuntimeInitialized ran!");

                    $(document).ready(function() {
                        document.addEventListener('touchstart', function(e) {
                            e.preventDefault();
                        }, { passive: false });

                        requestAnimationFrame(javascript_game_loop);

                        $('#add_entity_btn').click(() => {
                            console.log("Entity Created!");
                            Module.create_sprite();
                        });

                        let size_inputs = $('.input-size-box');
                        size_inputs.each((index, element) => {
                            $(element).on('input', function() {
                                let width = size_inputs[0].value;
                                let height = size_inputs[1].value;

                                Module.set_window_size(width, height);
                            })
                        })

                        let axis_inputs = $('.input-axis-box');
                        // Loop through them
                        axis_inputs.each((index, element) => {
                            $(element).on('input', function() {
                                let x = axis_inputs[0].value;
                                let y = axis_inputs[1].value;
                                let angle = $('#input-angle-box').val();

                                Module.set_current_position_angle(x, y, angle);
                            })
                        });

                        // Prevents the numbers being put below/above their min/max
                        // $('input[type="number"]').on('input', function() {
                        //     const min = parseInt($(this).attr('min'));
                        //     const max = parseInt($(this).attr('max'));

                        //     let val = parseInt($(this).val());
                        //     if (!isNaN(val))
                        //     {
                        //         if (val < min) $(this).val(min);
                        //         if (val > max) $(this).val(max);
                        //     }
                        // })

                        // This makes is so that if we click outside the canvas
                        // On something else other then a "button" or "input" then it blurs
                        function OnCanvasBlur() { 
                            Module.on_blur();
                        }

                        $("#canvas").on('focusout', function(e) {
                            const target_element = e.relatedTarget;
                            console.log(target_element);
                            if (target_element && $(target_element).is('input, button')) return;

                            OnCanvasBlur();
                        });
                    });
                },
                canvas: (function() {
                    var canvas = document.getElementById('canvas');
                    return canvas;
                })()
            };

            // Makes sure the inputs are only numbers
            $(document).ready(function() {
                $('input[type="number"]').on('keydown', function(e) {
                    if (["e", "E", "+", "-", "."].includes(e.key)) {
                        e.preventDefault();
                    }
                });

                // Only reset when user leaves the field
                $('input[type="number"]').on('blur', function() {
                    if ($(this).val() === "") {
                        $(this).val(0);
                    }
                });
            });
        </script>
        <script src="index.js"></script>
    </body>
</html>
