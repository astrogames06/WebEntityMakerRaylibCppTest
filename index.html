<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">

    <title>raylib web game</title>
    <link rel="shortcut icon" href="https://www.raylib.com/favicon.ico">
    <script src="https://code.jquery.com/jquery-4.0.0.min.js" integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>

    <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="main-wrapper">
            <div class="game-container">
                <div class="game-top-buttons-container">
                    <div class="top-buttons-left">
                        <button id="run-game-btn"><img src="assets/icons/play.svg" alt="play"></button>
                        <button id="reset-camera-btn" class="hidden">Reset Camera <img src="assets/icons/camera.svg" alt="camera"></button>
                    </div>
                    <div class="input-size-box-divs">
                        <div class="info-div-input-boxes">
                            <span class="label">width:</span>
                            <input type="number" value="840" min="300" max="800" step="1" pattern="[0-9]*" class="input-size-box" required>
                        </div>
                        <div class="info-div-input-boxes">
                            <span class="label">height:</span>
                            <input type="number" value="640" min="300" max="800" step="1" pattern="[0-9]*" class="input-size-box" required>
                        </div>
                    </div>
                </div>
                <canvas class=emscripten id=canvas oncontextmenu=event.preventDefault() tabindex=-1></canvas>

                <div class="game-bottom-buttons-container">
                    <button id="add_entity_btn">Add Sprite <img src="assets/icons/add_sprite.svg" alt="add_sprite"></button>

                    <div class="sprite-editor-inputs-container hidden">
                        <div class="input-axis-box-divs info-div-input-boxes">
                            <span class="label">x:</span>
                            <input type="number" value="0" min="0" step="1" pattern="[0-9]*" class="input-axis-box" required>
                        </div>
                        <div class="input-axis-box-divs info-div-input-boxes">
                            <span class="label">y:</span>
                            <input type="number" value="0" min="0" step="1" pattern="[0-9]*" class="input-axis-box" required>
                        </div>
                        <div class="input-axis-box-divs info-div-input-boxes">
                            <span class="label">rotation:</span>
                            <input type="number" value="0" min="0" max="360" step="1" pattern="[0-9]*" class="input-axis-box" id="input-angle-box" required>
                            <span>°</span>
                        </div>
                        <button class="delete-entity-btn" id="delete-entity-btn-game"><img src="assets/icons/trash.svg" alt="trash"></button>
                    </div>
                </div>
            </div>

            <div class="sprites-list-container">
                <ul class="sprites-list-ul">
                    <!-- For the code to duplicate the element -->
                    <li class="sprite-template" style="display:none;">
                        <div class="left-side-elements">
                            <img src="assets/icons/sprite.svg">
                            <p>#0</p>
                        </div>

                        <div class="right-side-elements">
                            <button class="delete-entity-btn-list delete-entity-btn button-to-show"><img src="assets/icons/trash.svg" alt="trash"></button>
                        </div>
                    </li>
                </ul>
            </div>
        </div>
        <div class="output-wrapper">
            <h1><img src="assets/icons/terminal.svg" alt="terminal">Terminal</h1>
            <textarea id="output" rows="20" cols="80" readonly></textarea>
        </div>

        <script>
            function javascript_game_loop()
            {
                // console.log("Module.is_sprite_selected(): ", Module.is_sprite_selected());
                let size_inputs = $('.input-size-box');
                let window_size = Module.get_window_size();
                size_inputs[0].value = window_size.x;
                size_inputs[1].value = window_size.y;

                let sprite_editor_inputs_container = $('.sprite-editor-inputs-container');
                let axis_inputs = $('.input-axis-box');

                let is_sprite_selected = Module.is_sprite_selected();
                
                if (is_sprite_selected)
                {
                    sprite_editor_inputs_container.removeClass('hidden') // Shows the inputs
                    let pos = Module.get_current_position_angle();
                    axis_inputs[0].value = pos.x;
                    axis_inputs[1].value = pos.y;

                    $('#input-angle-box').val(pos.z);

                    // $('.delete-entity-btn').show(); // shows the option to delete entity
                }
                else
                {
                    sprite_editor_inputs_container.addClass('hidden'); // Hides the inputs
                    // $('.delete-entity-btn').hide(); // hides the option to delete entity
                }

                // Shows the reset camera button
                if (Module.camera_has_been_moved())
                {
                    $('#reset-camera-btn').removeClass('hidden');
                }
                else
                {
                   $('#reset-camera-btn').addClass('hidden');
                }
                requestAnimationFrame(javascript_game_loop);
            }

            var Module = {
                onRuntimeInitialized: function () {
                    console.log("onRuntimeInitialized ran!");

                    $(document).ready(function() {
                        document.addEventListener('touchstart', function(e) {
                            e.preventDefault();
                        }, { passive: false });

                        requestAnimationFrame(javascript_game_loop);

                        $('#add_entity_btn').click(() => {
                            console.log("Entity Created!");
                            Module.create_sprite();
                        });

                        let size_inputs = $('.input-size-box');
                        size_inputs.each((index, element) => {
                            $(element).on('input', function() {
                                let width = size_inputs[0].value;
                                let height = size_inputs[1].value;

                                Module.set_window_size(width, height);
                            })
                        })

                        let axis_inputs = $('.input-axis-box');
                        // Loop through them
                        axis_inputs.each((index, element) => {
                            $(element).on('input', function() {
                                let x = axis_inputs[0].value;
                                let y = axis_inputs[1].value;
                                let angle = $('#input-angle-box').val();

                                Module.set_current_position_angle(x, y, angle);
                            })
                        });

                        // Prevents the numbers being put below/above their min/max
                        // $('input[type="number"]').on('input', function() {
                        //     const min = parseInt($(this).attr('min'));
                        //     const max = parseInt($(this).attr('max'));

                        //     let val = parseInt($(this).val());
                        //     if (!isNaN(val))
                        //     {
                        //         if (val < min) $(this).val(min);
                        //         if (val > max) $(this).val(max);
                        //     }
                        // })
                        $("#delete-entity-btn-game").on('click', function() {
                            Module.delete_current_entity();
                        });

                        $(document).on("click", ".delete-entity-btn-list", function () {
                            let entity_index = $(this).closest('li').index();
                            alert(entity_index);
                            Module.delete_indexed_entity(entity_index);
                        })

                        $("#reset-camera-btn").on('click', function() {
                            Module.reset_camera();
                        });

                        // This makes is so that if we click outside the canvas
                        // On something else other then a "button" or "input" then it blurs
                        function OnCanvasBlur() { 
                            Module.on_blur();
                        }

                        $("#canvas").on('focusout', function(e) {
                            const target_element = e.relatedTarget;
                            console.log(target_element);

                            // Prevents certain elements from blurring canvas
                            let elements_list = '.input-axis-box, .add_entity_btn, .delete-entity-btn';
                            if (target_element && $(target_element).is(elements_list)) return;

                            OnCanvasBlur();
                        });
                    });
                },
                print: (function() {
                    var element = document.getElementById('output');
                    if (element) element.value = ''; // clear browser cache
                    return function(text) {
                        if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
                        console.log(text);
                        if (element) {
                          element.value += text + "\n";
                          element.scrollTop = element.scrollHeight; // focus on bottom
                        }
                    };
                })(),
                canvas: (function() {
                    var canvas = document.getElementById('canvas');
                    return canvas;
                })()
            };

            // Makes sure the inputs are only numbers
            $(document).ready(function() {
                $('input[type="number"]').on('keydown', function(e) {
                    if (["e", "E", "+", "-", "."].includes(e.key)) {
                        e.preventDefault();
                    }
                });

                // Only reset when user leaves the field
                $('input[type="number"]').on('blur', function() {
                    if ($(this).val() === "") {
                        $(this).val(0);
                    }
                });

                // Opens the terminal when click
                $('.output-wrapper h1').on('click', function() {
                    if ($('#output').css('display') === 'none')
                    {
                        $('#output').css('display', 'flex')
                    }
                    else
                    {
                        $('#output').css('display', 'none')
                    }
                });
            });

            function AddEntityToList()
            {
                let new_item = $('.sprites-list-ul li').first().clone();
                new_item.css('display', 'flex');

                let sprite_list_name = $('.sprites-list-ul li').length;
                new_item.find('p').text(`#${sprite_list_name}`);

                $('.sprites-list-ul').append(new_item);
            }
            function RemoveEntityFromList(index)
            {
                $('.sprites-list-ul li').eq(index).remove();
            }
        </script>
        <script src="index.js"></script>
    </body>
</html>
