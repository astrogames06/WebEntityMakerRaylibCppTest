<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">

    <title>raylib web game</title>
    <link rel="shortcut icon" href="https://www.raylib.com/favicon.ico">
    <script src="https://code.jquery.com/jquery-4.0.0.min.js" integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <link rel="stylesheet" href="styles/style.css">
    <link rel="stylesheet" href="styles/canvas.css">
    <link rel="stylesheet" href="styles/layout.css">
    <link rel="stylesheet" href="styles/game.css">
    <link rel="stylesheet" href="styles/buttons.css">
    <link rel="stylesheet" href="styles/inputs.css">
    <link rel="stylesheet" href="styles/sprites-list.css">
    <link rel="stylesheet" href="styles/sprite-selector.css">
    <link rel="stylesheet" href="styles/game-settings.css">
    <link rel="stylesheet" href="styles/blur.css">
    <link rel="stylesheet" href="styles/terminal.css">
    </head>
    <body>
        <div class="main-wrapper">
            <div class="game-container">
                <div class="game-top-buttons-container">
                    <div class="top-buttons-left">
                        <button id="run-game-btn"><img src="assets/icons/play.svg" alt="play"></button>
                        <button id="code-editor-btn">
                            <a>Code Editor <img src="assets/icons/code.svg" alt="code"></a>
                        </button>
                        <button id="game-settings-btn">Settings <img src="assets/icons/settings.svg" alt="settings"></button>
                    </div>
                </div>
                <canvas class=emscripten id=canvas oncontextmenu=event.preventDefault() tabindex=-1></canvas>

                <div class="game-bottom-buttons-container">
                    <button id="add_entity_btn">Add Sprite <img src="assets/icons/add_sprite.svg" alt="add_sprite"></button>

                    <div class="sprite-editor-inputs-container hidden">
                        <div class="info-div-input-boxes">
                            <span class="label">name:</span>
                            <input type="text" id="input-name-box" required>
                        </div>
                        <div class="input-axis-box-divs info-div-input-boxes">
                            <span class="label">x:</span>
                            <input type="number" value="0" min="0" step="1" pattern="[0-9]*" class="input-axis-box" required>
                        </div>
                        <div class="input-axis-box-divs info-div-input-boxes">
                            <span class="label">y:</span>
                            <input type="number" value="0" min="0" step="1" pattern="[0-9]*" class="input-axis-box" required>
                        </div>
                        <div class="input-axis-box-divs info-div-input-boxes">
                            <span class="label">rotation:</span>
                            <input type="number" value="0" min="0" max="360" step="1" pattern="[0-9]*" class="input-axis-box" id="input-angle-box" required>
                            <span>°</span>
                        </div>
                        <button id="duplicate-entity-btn-game"><img src="assets/icons/copy.svg" alt="duplicate"></button>
                        <button class="delete-entity-btn" id="delete-entity-btn-game"><img src="assets/icons/trash.svg" alt="trash"></button>
                    </div>
                </div>
            </div>

            <div class="sprites-list-container">
                <ul class="sprites-list-ul">
                </ul>
            </div>
        </div>
        <div id="game-settings-container" class="game-settings-part hidden">
            <div id="game-settings-items">
                <button id="game-settings-close">
                    <img src="assets/icons/x.svg" alt="close">
                </button>

                <div id="game-settings-scroll-content">
                    <h1 class="game-settings-title">Game Settings</h1>

                    <h2 class="game-settings-sub">Window Size</h2>
                    <div class="input-size-box-divs">
                        <div class="info-div-input-boxes">
                            <span class="label">width:</span>
                            <input type="number" value="840" min="300" max="800" step="1" pattern="[0-9]*" class="input-size-box" required>
                        </div>
                        <div class="info-div-input-boxes">
                            <span class="label">height:</span>
                            <input type="number" value="640" min="300" max="800" step="1" pattern="[0-9]*" class="input-size-box" required>
                        </div>
                    </div>
                    <h2 class="game-settings-sub">Camera</h2>
                    <button id="reset-camera-btn">Reset Camera <img src="assets/icons/camera.svg" alt="camera"></button>

                    <h2 class="game-settings-sub">Grid</h2>
                    <label id="showgrid-btn">Show Grid<input id="showgrid-checkbox" type="checkbox"></label>

                    <h2 class="game-settings-sub">Show Info (Camera, FPS)</h2>
                    <label id="showinfo-btn">Show Info<input id="showinfo-checkbox" type="checkbox"></label>
                </div>
            </div>
        </div>
        <div class="blur-bg game-settings-part hidden"></div> <!-- This is what is used to blur the background -->

        <div id="sprite-selector-container" class="sprite-selector-container-part hidden">
            <h1 id="sprite-selector-container-title">Sprite Selector</h1>

            <div id="sprite-selector-items-grid">

            </div>
        </div>
        <button id="sprite-selector-close" class="sprite-selector-container-part hidden">
            <img src="assets/icons/x.svg" alt="close">
        </button>
        <div class="blur-bg sprite-selector-container-part hidden"></div> <!-- This is what is used to blur the background -->

        <!-- For the code to duplicate the element -->
        <li class="sprite-template" style="display:none;">
            <div class="left-side-elements">
                <img src="assets/icons/sprite.svg">
                <p class="entity-list-number">#0</p>
            </div>

            <div class="right-side-elements">
                <p class="entity-list-name"></p>
                <button class="look-entity-btn-list button-to-show"><img src="assets/icons/eye.svg" alt="look"></button>
                <button class="copy-entity-btn-list button-to-show"><img src="assets/icons/copy.svg" alt="copy"></button>
                <button class="delete-entity-btn-list delete-entity-btn button-to-show"><img src="assets/icons/trash.svg" alt="trash"></button>
            </div>
        </li>

        <div class="output-wrapper">
            <h1><img src="assets/icons/terminal.svg" alt="terminal">Terminal</h1>
            <textarea id="output" rows="20" cols="80" readonly></textarea>
        </div>

        <script src="scripts/inputs.js"></script>
        <script src="scripts/entity_list.js"></script>
        <script src="scripts/javascript_game_loop.js"></script>
        <script src="scripts/sprite_selector.js"></script>
        <script src="scripts/game_settings.js"></script>
        <script src="scripts/ui_handlers.js"></script>
        <script src="scripts/grid.js"></script>
        <script src="scripts/main.js"></script>
        <script src="index.js"></script>
    </body>
</html>
