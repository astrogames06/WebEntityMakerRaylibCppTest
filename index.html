<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">

    <title>raylib web game</title>
    <link rel="shortcut icon" href="https://www.raylib.com/favicon.ico">
    <script src="https://code.jquery.com/jquery-4.0.0.min.js" integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>

    <style>
        body { margin: 0px; }
        canvas.emscripten { border: 0px none; background-color: black; outline: none !important; }
    </style>
    </head>
    <body>
        <canvas class=emscripten id=canvas oncontextmenu=event.preventDefault() tabindex=-1></canvas>
        <button id="add_entity_btn">Add Cat Entity</button>
        <script>
            var Module = {
                onRuntimeInitialized: function () {
                    console.log("onRuntimeInitialized ran!");

                    $('#add_entity_btn').click(() => {
                        console.log("Entity Created!");
                        Module.create_entity();
                    })
                },
                canvas: (function() {
                    var canvas = document.getElementById('canvas');
                    return canvas;
                })()
            };
        </script>
        <script src="index.js"></script>
    </body>
</html>
